# Runs due searches (and sends Telegram alerts) by calling the deployed app every few minutes.
# Repo secrets needed: APP_BASE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
name: tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/tick
        run: |
          curl --fail-with-body -sS --max-time 330 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/tick"
